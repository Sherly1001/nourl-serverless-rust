[package]
name = "backend"
edition.workspace = true
version.workspace = true

[dependencies]
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie", "query"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
argon2 = { version = "0.5", features = ["std"] }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
regex = "1"
lambda_http = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
mongodb = "3"
bson = "2"
chrono = "0.4"
dotenvy = "0.15"
futures = "0.3"
# rustls rather than the default native-tls: the Lambda image ships no system
# OpenSSL, and the OAuth providers are the only thing this ever calls out to.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
async-trait = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
shared = { path = "../shared" }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
