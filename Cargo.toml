[workspace]
resolver = "2"
members = ["shared", "backend", "frontend"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.dev.package."*"]
opt-level = 3
